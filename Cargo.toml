[workspace]
members = [
    "crates/mappamente-core",
    "crates/mappamente",
    "crates/mappamente-mcp",
    "crates/mappamente-ai",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Mappamente contributors"]
description = "Mappamente — a lightweight, open-source mind map editor"
repository = "https://github.com/Marcu08/mappamente"
homepage = "https://github.com/Marcu08/mappamente"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
eframe = "0.37"
fastrand = "2.5.0"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.18"
rmcp = { version = "3.11.0", default-features = false, features = ["macros", "server", "transport-io"] }
roxmltree = "0.21"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std"] }
unicode-width = "0.2.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
